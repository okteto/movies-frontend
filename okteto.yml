build:
  frontend:
    context: .
    dockerfile: Dockerfile
  
  frontend-dev:
    context: .
    dockerfile: Dockerfile
    target: dev

dependencies:
  movies-multi-repo:
     repository: https://github.com/okteto/movies-multi-repo
     branch: e2e-tests-gateway

deploy:
  - name: Deploy Frontend
    command: helm upgrade --install movies-frontend chart --set image=${OKTETO_BUILD_FRONTEND_IMAGE}

dev:
  frontend:
    image: ${OKTETO_BUILD_FRONTEND_DEV_IMAGE}
    command: yarn start
    sync:
      - .:/src
