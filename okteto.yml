build:
  frontend-dev:
    context: .
    target: dev
  frontend:
    context: .
    target: prod
    depends_on:
      - frontend-dev

deploy:
  - name: Deploy Frontend
    command: helm upgrade --install movies-frontend chart --set image=${OKTETO_BUILD_FRONTEND_IMAGE}

dev:
  frontend:
    image: ${OKTETO_BUILD_FRONTEND_DEV_IMAGE}
    command: npm start
    sync:
      - .:/src
    persistentVolume:
      enabled: false
